<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Layanan & Informasi Puskesmas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js untuk Interaktivitas -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts -->
    <link id="dynamic-font-link" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: var(--app-font, 'Inter', sans-serif);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col transition-colors duration-300" 
      :style="`--app-font: '${fontFamily}', sans-serif;`"
      x-data="puskesmasApp()" 
      :class="currentTheme.bgClass">

    <!-- HEADER / NAVBAR -->
    <header :class="currentTheme.headerBg" class="shadow-md sticky top-0 z-50 backdrop-blur-md bg-opacity-90 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg" :class="currentTheme.accentBg" x-text="config.appLogoText"></div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl leading-tight" :class="currentTheme.headerText" x-text="config.appName"></h1>
                    <p class="text-xs opacity-80" :class="currentTheme.headerText" x-text="config.appSubtitle"></p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Tombol Kelola Kegiatan -->
                <button @click="showManager = true" class="flex items-center space-x-2 px-3 py-2 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm font-medium shadow-sm transition transform active:scale-95 bg-emerald-600 text-white hover:bg-emerald-700">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    <span class="hidden sm:inline">Kelola / Tambah Kegiatan</span>
                </button>

                <!-- Tombol Pengaturan & Tema -->
                <button @click="showCustomizer = !showCustomizer" class="flex items-center space-x-2 px-3 py-2 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm font-medium shadow-sm transition transform active:scale-95" :class="currentTheme.buttonClass">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="hidden sm:inline">Pengaturan & Tema</span>
                </button>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- HERO BANNER DENGAN FOTO BERGAMBAR -->
        <section class="rounded-3xl p-8 mb-10 shadow-2xl relative overflow-hidden transition-all duration-300 min-h-[240px] flex items-center" 
                 :class="heroImageUrl ? '' : currentTheme.heroBg"
                 :style="heroImageUrl ? `background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.65)), url('${heroImageUrl}') center/cover no-repeat;` : ''">
            <div class="relative z-10 max-w-3xl">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold mb-3 bg-white/20 backdrop-blur-md text-white" x-text="config.heroBadge"></span>
                <h2 class="text-3xl sm:text-4xl font-extrabold text-white mb-4 leading-tight" x-text="config.heroTitle"></h2>
                <p class="text-white/90 text-sm sm:text-base leading-relaxed max-w-2xl" x-text="config.heroDescription"></p>
            </div>
            
            <template x-if="!heroImageUrl">
                <div class="absolute -right-10 -bottom-10 w-72 h-72 rounded-full bg-white/10 blur-3xl pointer-events-none"></div>
            </template>
        </section>

        <!-- KOTAK PENCARIAN & CATEGORY FILTER -->
        <div class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="w-full md:w-96 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text" x-model="searchQuery" placeholder="Cari kegiatan atau layanan..." class="w-full pl-10 pr-4 py-3 rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm transition">
            </div>
            <div class="flex items-center space-x-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                <button @click="selectedCategory = 'Semua'" :class="selectedCategory === 'Semua' ? currentTheme.accentBg + ' text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition whitespace-nowrap">Semua</button>
                <template x-for="cat in categories" :key="cat">
                    <button @click="selectedCategory = cat" :class="selectedCategory === cat ? currentTheme.accentBg + ' text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition whitespace-nowrap" x-text="cat"></button>
                </template>
            </div>
        </div>

        <!-- DAFTAR KARTU KEGIATAN & LINK -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="item in filteredLinks" :key="item.id">
                <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-md hover:shadow-2xl transition-all duration-300 border border-gray-100 dark:border-gray-700 flex flex-col justify-between group relative">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl shadow-inner bg-gray-50 dark:bg-gray-700" x-text="item.icon || '📌'"></span>
                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400" x-text="item.category"></span>
                        </div>
                        <h3 class="font-bold text-lg text-gray-800 dark:text-white mb-2 group-hover:text-emerald-500 transition" x-text="item.title"></h3>
                        <p class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed mb-6" x-text="item.description"></p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <a :href="item.url" target="_blank" class="flex-1 py-3 rounded-xl font-medium text-sm flex items-center justify-center space-x-2 transition shadow-sm" :class="currentTheme.cardButtonClass">
                            <span>Akses Layanan</span>
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                        </a>
                        <button @click="deleteLink(item.id)" title="Hapus Kegiatan" class="p-3 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-xl transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="filteredLinks.length === 0" class="text-center py-16">
            <p class="text-gray-500 dark:text-gray-400 text-lg">Belum ada kegiatan/layanan di kategori ini.</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto bg-white dark:bg-gray-800 border-t border-gray-100 dark:border-gray-700 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500 dark:text-gray-400">
            <p x-text="config.footerText"></p>
        </div>
    </footer>

    <!-- MODAL POPUP: KELOLA & TAMBAH KEGIATAN BARU -->
    <div x-show="showManager" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" @click="showManager = false"></div>
        <div class="relative min-h-screen flex items-center justify-center p-4">
            <div class="relative bg-white dark:bg-gray-900 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-6">
                <div class="flex justify-between items-center pb-3 border-b border-gray-100 dark:border-gray-800">
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white">Tambah Kegiatan / Link Baru</h3>
                    <button @click="showManager = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <form @submit.prevent="addLink()" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Judul Kegiatan / Layanan</label>
                        <input type="text" x-model="newForm.title" required placeholder="Contoh: Skrining Posyandu Lansia" class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Kategori</label>
                            <select x-model="newForm.category" class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                <template x-for="cat in categories" :key="cat">
                                    <option :value="cat" x-text="cat"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Ikon / Emoji</label>
                            <input type="text" x-model="newForm.icon" placeholder="📋, 💉, 🏥..." class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Deskripsi Singkat</label>
                        <textarea x-model="newForm.description" required placeholder="Jelaskan secara singkat mengenai kegiatan ini..." class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 h-20"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">URL / Link Tujuan</label>
                        <input type="url" x-model="newForm.url" required placeholder="https://..." class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div class="pt-3 flex space-x-3">
                        <button type="button" @click="showManager = false" class="w-1/2 py-3 rounded-xl font-medium text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 transition">Batal</button>
                        <button type="submit" class="w-1/2 py-3 rounded-xl font-medium text-white bg-emerald-600 hover:bg-emerald-700 transition shadow-md">Simpan Kegiatan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- PANEL PENGATURAN TEMA & FOTO BANNER -->
    <div x-show="showCustomizer" class="fixed inset-0 z-50 overflow-hidden" style="display: none;">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" @click="showCustomizer = false"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white dark:bg-gray-900 shadow-2xl p-6 flex flex-col justify-between overflow-y-auto">
                <div class="space-y-6">
                    <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-gray-800">
                        <h3 class="font-bold text-lg text-gray-800 dark:text-white">Kustomisasi Tampilan</h3>
                        <button @click="showCustomizer = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>

                    <!-- UPLOAD FOTO GAMBAR BANNER UTAMA -->
                    <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
                        <label class="block text-sm font-semibold text-gray-800 dark:text-white mb-1">🖼️ Foto Banner Utama (Hero Image)</label>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mb-3">Upload foto gedung puskesmas, kegiatan, atau foto apa saja dari HP/Laptop Anda.</p>
                        
                        <input type="file" id="heroImageInput" accept="image/*" @change="uploadHeroImage($event)" class="hidden">
                        
                        <div class="flex flex-col space-y-2">
                            <button @click="document.getElementById('heroImageInput').click()" class="w-full py-2.5 px-4 rounded-xl font-medium text-xs bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center space-x-2 transition shadow">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                <span>Pilih Foto dari Perangkat</span>
                            </button>

                            <button x-show="heroImageUrl" @click="resetHeroImage()" class="w-full py-2 px-4 rounded-xl font-medium text-xs text-red-500 bg-red-50 dark:bg-red-900/20 hover:bg-red-100 transition">
                                Hapus Foto (Gunakan Warna Gradasi)
                            </button>
                        </div>
                    </div>

                    <!-- Pilih Tema Warna -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">Pilih Warna Tema Aplikasi</label>
                        <div class="grid grid-cols-2 gap-3">
                            <template x-for="(t, index) in themes" :key="index">
                                <button @click="setTheme(index)" :class="currentThemeIndex === index ? 'ring-2 ring-emerald-500 shadow-md' : 'border border-gray-200 dark:border-gray-700'" class="p-3 rounded-2xl flex items-center space-x-3 text-left transition bg-gray-50 dark:bg-gray-800">
                                    <span class="w-6 h-6 rounded-full" :class="t.dotColor"></span>
                                    <span class="text-xs font-medium text-gray-800 dark:text-gray-200" x-text="t.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Pilih Font -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Pilih Jenis Font Teks</label>
                        <select x-model="fontFamily" @change="changeFont()" class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Inter">Inter (Clean & Modern)</option>
                            <option value="Poppins">Poppins (Rounded & Friendly)</option>
                            <option value="Roboto">Roboto (Standard Professional)</option>
                            <option value="Plus Jakarta Sans">Plus Jakarta Sans (Geometrik)</option>
                        </select>
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-100 dark:border-gray-800">
                    <button @click="showCustomizer = false" class="w-full py-3 rounded-xl font-medium text-white bg-emerald-600 hover:bg-emerald-700 shadow-md transition">
                        Tutup Pengaturan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIKA SKRIP APLIKASI -->
    <script>
        function puskesmasApp() {
            return {
                showCustomizer: false,
                showManager: false,
                searchQuery: '',
                selectedCategory: 'Semua',
                fontFamily: 'Inter',
                currentThemeIndex: 0,
                heroImageUrl: '',

                newForm: {
                    title: '',
                    category: 'Kluster 1 & Manajemen',
                    description: '',
                    icon: '📋',
                    url: ''
                },
                
                config: {
                    appName: 'UPT Puskesmas Sentolo I',
                    appSubtitle: 'Portal Layanan & Informasi Kesehatan',
                    appLogoText: 'PKM',
                    heroBadge: '✨ Layanan Kesehatan Terpadu',
                    heroTitle: 'Selamat Datang di Portal Terpadu Puskesmas',
                    heroDescription: 'Akses seluruh program kerja, pendaftaran layanan, rekam data, dan informasi kesehatan masyarakat secara cepat, transparan, dan terintegrasi.',
                    footerText: '© 2026 UPT Puskesmas Sentolo I. Aplikasi Dinamis & Profesional.'
                },

                categories: ['Kluster 1 & Manajemen', 'Kluster 2 (Ibu & Anak)', 'Kluster 3 (Usia Produktif)', 'Kluster 4 (Lansia & PTM)', 'Surveilans & Umum'],

                links: [],

                themes: [
                    {
                        name: 'Emerald Mint',
                        dotColor: 'bg-emerald-600',
                        bgClass: 'bg-slate-50 dark:bg-slate-950',
                        headerBg: 'bg-white/80 dark:bg-slate-900/80',
                        headerText: 'text-slate-800 dark:text-white',
                        accentBg: 'bg-emerald-600',
                        heroBg: 'bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-700',
                        buttonClass: 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 dark:bg-slate-800 dark:text-emerald-400',
                        cardButtonClass: 'bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white dark:bg-slate-700 dark:text-emerald-400 dark:hover:bg-emerald-600 dark:hover:text-white'
                    },
                    {
                        name: 'Blue Ocean',
                        dotColor: 'bg-blue-600',
                        bgClass: 'bg-zinc-50 dark:bg-zinc-950',
                        headerBg: 'bg-white/80 dark:bg-zinc-900/80',
                        headerText: 'text-zinc-800 dark:text-white',
                        accentBg: 'bg-blue-600',
                        heroBg: 'bg-gradient-to-r from-blue-600 via-indigo-600 to-sky-700',
                        buttonClass: 'bg-blue-50 text-blue-700 hover:bg-blue-100 dark:bg-zinc-800 dark:text-blue-400',
                        cardButtonClass: 'bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white dark:bg-zinc-700 dark:text-blue-400 dark:hover:bg-blue-600 dark:hover:text-white'
                    },
                    {
                        name: 'Purple Sunset',
                        dotColor: 'bg-purple-600',
                        bgClass: 'bg-stone-50 dark:bg-stone-950',
                        headerBg: 'bg-white/80 dark:bg-stone-900/80',
                        headerText: 'text-stone-800 dark:text-white',
                        accentBg: 'bg-purple-600',
                        heroBg: 'bg-gradient-to-r from-purple-600 via-pink-600 to-rose-600',
                        buttonClass: 'bg-purple-50 text-purple-700 hover:bg-purple-100 dark:bg-stone-800 dark:text-purple-400',
                        cardButtonClass: 'bg-purple-50 text-purple-600 hover:bg-purple-600 hover:text-white dark:bg-stone-700 dark:text-purple-400 dark:hover:bg-purple-600 dark:hover:text-white'
                    },
                    {
                        name: 'Dark Charcoal',
                        dotColor: 'bg-gray-900',
                        bgClass: 'bg-neutral-900 text-neutral-100',
                        headerBg: 'bg-neutral-900/90',
                        headerText: 'text-white',
                        accentBg: 'bg-neutral-700',
                        heroBg: 'bg-gradient-to-r from-neutral-800 to-neutral-950 border border-neutral-800',
                        buttonClass: 'bg-neutral-800 text-neutral-200 hover:bg-neutral-700',
                        cardButtonClass: 'bg-neutral-800 text-neutral-200 hover:bg-white hover:text-neutral-900'
                    }
                ],

                get currentTheme() {
                    return this.themes[this.currentThemeIndex] || this.themes[0];
                },

                setTheme(index) {
                    this.currentThemeIndex = index;
                    localStorage.setItem('pkm_theme', index);
                },

                uploadHeroImage(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.heroImageUrl = e.target.result;
                            localStorage.setItem('pkm_hero_image', this.heroImageUrl);
                        };
                        reader.readAsDataURL(file);
                    }
                },

                resetHeroImage() {
                    this.heroImageUrl = '';
                    localStorage.removeItem('pkm_hero_image');
                },

                changeFont() {
                    const fontLink = document.getElementById('dynamic-font-link');
                    fontLink.href = `https://fonts.googleapis.com/css2?family=${this.fontFamily.replace(/ /g, '+')}:wght@300;400;500;600;700&display=swap`;
                    localStorage.setItem('pkm_font', this.fontFamily);
                },

                addLink() {
                    const newItem = {
                        id: Date.now(),
                        title: this.newForm.title,
                        category: this.newForm.category,
                        description: this.newForm.description,
                        icon: this.newForm.icon || '📋',
                        url: this.newForm.url
                    };
                    this.links.unshift(newItem);
                    this.saveLinks();
                    
                    this.newForm = { title: '', category: 'Kluster 1 & Manajemen', description: '', icon: '📋', url: '' };
                    this.showManager = false;
                },

                deleteLink(id) {
                    if (confirm('Apakah Anda yakin ingin menghapus kegiatan ini?')) {
                        this.links = this.links.filter(item => item.id !== id);
                        this.saveLinks();
                    }
                },

                saveLinks() {
                    localStorage.setItem('pkm_links_data', JSON.stringify(this.links));
                },

                get filteredLinks() {
                    return this.links.filter(item => {
                        const matchesSearch = item.title.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                              item.description.toLowerCase().includes(this.searchQuery.toLowerCase());
                        const matchesCat = this.selectedCategory === 'Semua' || item.category === this.selectedCategory;
                        return matchesSearch && matchesCat;
                    });
                },

                init() {
                    const savedTheme = localStorage.getItem('pkm_theme');
                    if (savedTheme !== null) this.currentThemeIndex = parseInt(savedTheme);

                    const savedFont = localStorage.getItem('pkm_font');
                    if (savedFont !== null) {
                        this.fontFamily = savedFont;
                        this.changeFont();
                    }

                    const savedHeroImage = localStorage.getItem('pkm_hero_image');
                    if (savedHeroImage) this.heroImageUrl = savedHeroImage;

                    const savedLinks = localStorage.getItem('pkm_links_data');
                    if (savedLinks) {
                        this.links = JSON.parse(savedLinks);
                    } else {
                        this.links = [
                            { id: 1, title: 'Pendaftaran Pasien Online', category: 'Surveilans & Umum', description: 'Layanan antrean dan pendaftaran berobat harian secara mandiri dari rumah.', icon: '📋', url: 'https://google.com' },
                            { id: 2, title: 'Manajemen Data Kluster 1', category: 'Kluster 1 & Manajemen', description: 'Pusat data manajemen, perencanaan kegiatan, dan administrasi operasional puskesmas.', icon: '📊', url: 'ttps://script.google.com/macros/s/AKfycbxWHyqdJD6S6M8v_UuHPLN8nbVJt02gTY1z_df0dJA9RK-3GbKCZ-oj_8UlY6XqMg1FwA/exec' },
                            { id: 3, title: 'Pengembangan Kompetensi Pegawai', category: 'Kluster 1 & Manajemen', description: 'Portal kehadiran, catatan pelatihan, pengembangan kompetensi, dan unduh sertifikat staf.', icon: '🎓', url: 'https://google.com' }
                        ];
                        this.saveLinks();
                    }
                }
            }
        }
    </script>
</body>
