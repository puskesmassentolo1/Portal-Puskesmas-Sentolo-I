<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Layanan & Informasi Puskesmas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <!-- Google Fonts -->
    <link id="dynamic-font-link" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: var(--app-font, 'Inter', sans-serif); }
    </style>
</head>
<body class="min-h-screen flex flex-col transition-colors duration-300" 
      :style="`--app-font: '${fontFamily}', sans-serif;`"
      x-data="puskesmasApp" 
      x-cloak
      :class="currentTheme.bgClass">

    <!-- HEADER / NAVBAR -->
    <header :class="currentTheme.headerBg" class="shadow-md sticky top-0 z-40 backdrop-blur-md bg-opacity-90 transition-colors duration-300 border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg" :class="currentTheme.accentBg" x-text="config.appLogoText"></div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl leading-tight" :class="currentTheme.headerText" x-text="config.appName"></h1>
                    <p class="text-xs opacity-80" :class="currentTheme.headerText" x-text="config.appSubtitle"></p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- MENU UNTUK ADMIN -->
                <template x-if="isAdmin">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-500 border border-amber-500/30 font-semibold hidden sm:inline">Mode Admin Active</span>
                        
                        <!-- Tombol Tambah Kegiatan -->
                        <button @click="showManager = true" class="flex items-center space-x-1 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm transition active:scale-95">
                            <span>+ Tambah Kegiatan</span>
                        </button>

                        <!-- Tombol Kustomisasi Web -->
                        <button @click="showCustomizer = true" class="flex items-center space-x-1 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium shadow-sm transition active:scale-95" :class="currentTheme.buttonClass">
                            <span>⚙️ Kustomisasi Web</span>
                        </button>

                        <!-- Tombol Keluar Admin -->
                        <button @click="logoutAdmin()" class="px-3 py-2 rounded-xl text-xs bg-red-500/10 text-red-500 hover:bg-red-500/20 transition">
                            Keluar
                        </button>
                    </div>
                </template>

                <!-- TOMBOL LOGIN ADMIN -->
                <template x-if="!isAdmin">
                    <button @click="showLoginModal = true" class="flex items-center space-x-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-800 text-gray-200 hover:bg-slate-700 transition">
                        <span>🔑 Login Admin</span>
                    </button>
                </template>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- HERO BANNER -->
        <section class="rounded-3xl p-8 mb-10 shadow-2xl relative overflow-hidden transition-all duration-300 min-h-[240px] flex items-center" 
                 :class="heroImageUrl ? '' : currentTheme.heroBg"
                 :style="heroImageUrl ? `background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.65)), url('${heroImageUrl}') center/cover no-repeat;` : ''">
            <div class="relative z-10 max-w-3xl">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold mb-3 bg-white/20 backdrop-blur-md text-white" x-text="config.heroBadge"></span>
                <h2 class="text-3xl sm:text-4xl font-extrabold text-white mb-4 leading-tight" x-text="config.heroTitle"></h2>
                <p class="text-white/90 text-sm sm:text-base leading-relaxed max-w-2xl" x-text="config.heroDescription"></p>
            </div>
        </section>

        <!-- BARIS PENCARIAN & FITUR UBAH MODE TAMPILAN -->
        <div class="mb-6 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
            <!-- PENCARIAN -->
            <div class="w-full md:w-80 relative">
                <input type="text" x-model="searchQuery" placeholder="🔍 Cari kegiatan atau layanan..." class="w-full px-4 py-3 rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm transition text-sm">
            </div>

            <!-- SWITCHER MODE TAMPILAN (Kartu / Tabel / Daftar) -->
            <div class="flex items-center justify-between sm:justify-start gap-2 bg-white dark:bg-gray-800 p-1.5 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
                <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 px-2 hidden sm:inline">Model Tampilan:</span>
                <div class="flex space-x-1 w-full sm:w-auto">
                    <!-- Option 1: Grid Kartu -->
                    <button @click="viewMode = 'grid'" 
                            :class="viewMode === 'grid' ? currentTheme.accentBg + ' text-white font-medium shadow-sm' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'"
                            class="flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs flex items-center justify-center space-x-1.5 transition">
                        <span>🎴</span>
                        <span class="font-medium">Kartu</span>
                    </button>

                    <!-- Option 2: Tabel Sederhana -->
                    <button @click="viewMode = 'table'" 
                            :class="viewMode === 'table' ? currentTheme.accentBg + ' text-white font-medium shadow-sm' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'"
                            class="flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs flex items-center justify-center space-x-1.5 transition">
                        <span>📊</span>
                        <span class="font-medium">Tabel</span>
                    </button>

                    <!-- Option 3: List Ringkas -->
                    <button @click="viewMode = 'list'" 
                            :class="viewMode === 'list' ? currentTheme.accentBg + ' text-white font-medium shadow-sm' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'"
                            class="flex-1 sm:flex-initial px-3 py-2 rounded-xl text-xs flex items-center justify-center space-x-1.5 transition">
                        <span>📑</span>
                        <span class="font-medium">Daftar</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- FILTER KATEGORI KLUSTER -->
        <div class="mb-8 flex items-center space-x-2 overflow-x-auto pb-2 scrollbar-none">
            <button @click="selectedCategory = 'Semua'" :class="selectedCategory === 'Semua' ? currentTheme.accentBg + ' text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'" class="px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition whitespace-nowrap">Semua</button>
            <template x-for="cat in categories" :key="cat">
                <button @click="selectedCategory = cat" :class="selectedCategory === cat ? currentTheme.accentBg + ' text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'" class="px-4 py-2 rounded-xl text-sm font-medium shadow-sm transition whitespace-nowrap" x-text="cat"></button>
            </template>
        </div>

        <!-- MODE 1: TAMPILAN KARTU (GRID) -->
        <div x-show="viewMode === 'grid'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="item in filteredLinks" :key="item.id">
                <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-md hover:shadow-2xl transition-all duration-300 border border-gray-100 dark:border-gray-700 flex flex-col justify-between group relative overflow-hidden">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-16 h-16 rounded-2xl overflow-hidden flex items-center justify-center bg-gray-100 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 shadow-inner">
                                <template x-if="item.image">
                                    <img :src="item.image" class="w-full h-full object-cover">
                                </template>
                                <template x-if="!item.image">
                                    <span class="text-3xl" x-text="item.icon || '📌'"></span>
                                </template>
                            </div>

                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400" x-text="item.category"></span>
                        </div>
                        <h3 class="font-bold text-lg text-gray-800 dark:text-white mb-2 group-hover:text-emerald-500 transition" x-text="item.title"></h3>
                        <p class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed mb-6" x-text="item.description"></p>
                    </div>

                    <div class="flex items-center space-x-2">
                        <a :href="item.url" target="_blank" class="flex-1 py-3 rounded-xl font-medium text-sm text-center transition shadow-sm" :class="currentTheme.cardButtonClass">
                            Akses Layanan ↗
                        </a>

                        <template x-if="isAdmin">
                            <button @click="deleteLink(item.id)" title="Hapus Kegiatan" class="p-3 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-xl transition">
                                🗑️
                            </button>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- MODE 2: TAMPILAN TABEL SEDERHANA -->
        <div x-show="viewMode === 'table'" class="bg-white dark:bg-gray-800 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600 dark:text-gray-300">
                    <thead class="bg-gray-50 dark:bg-gray-900/50 uppercase text-xs text-gray-500 dark:text-gray-400 border-b border-gray-200 dark:border-gray-700">
                        <tr>
                            <th scope="col" class="px-6 py-4 font-semibold">Layanan / Kegiatan</th>
                            <th scope="col" class="px-6 py-4 font-semibold">Kategori</th>
                            <th scope="col" class="px-6 py-4 font-semibold">Keterangan / Fungsi</th>
                            <th scope="col" class="px-6 py-4 font-semibold text-center">Tautan</th>
                            <template x-if="isAdmin">
                                <th scope="col" class="px-6 py-4 font-semibold text-center">Aksi</th>
                            </template>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 dark:divide-gray-700/50">
                        <template x-for="item in filteredLinks" :key="item.id">
                            <tr class="hover:bg-gray-50/80 dark:hover:bg-gray-700/40 transition">
                                <td class="px-6 py-4">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl flex-shrink-0 flex items-center justify-center bg-gray-100 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 overflow-hidden">
                                            <template x-if="item.image">
                                                <img :src="item.image" class="w-full h-full object-cover">
                                            </template>
                                            <template x-if="!item.image">
                                                <span class="text-xl" x-text="item.icon || '📌'"></span>
                                            </template>
                                        </div>
                                        <span class="font-bold text-gray-800 dark:text-white" x-text="item.title"></span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400" x-text="item.category"></span>
                                </td>
                                <td class="px-6 py-4 text-xs max-w-xs sm:max-w-md text-gray-500 dark:text-gray-400 leading-relaxed" x-text="item.description"></td>
                                <td class="px-6 py-4 text-center whitespace-nowrap">
                                    <a :href="item.url" target="_blank" class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-sm">
                                        Buka Link ↗
                                    </a>
                                </td>
                                <template x-if="isAdmin">
                                    <td class="px-6 py-4 text-center whitespace-nowrap">
                                        <button @click="deleteLink(item.id)" title="Hapus Kegiatan" class="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition">
                                            🗑️
                                        </button>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MODE 3: TAMPILAN DAFTAR RINGKAS (LIST) -->
        <div x-show="viewMode === 'list'" class="space-y-3">
            <template x-for="item in filteredLinks" :key="item.id">
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 border border-gray-100 dark:border-gray-700 shadow-sm hover:shadow-md transition flex items-center justify-between gap-4">
                    <div class="flex items-center space-x-4 min-w-0">
                        <div class="w-12 h-12 rounded-xl flex-shrink-0 flex items-center justify-center bg-gray-100 dark:bg-gray-700 overflow-hidden border border-gray-200 dark:border-gray-600">
                            <template x-if="item.image">
                                <img :src="item.image" class="w-full h-full object-cover">
                            </template>
                            <template x-if="!item.image">
                                <span class="text-2xl" x-text="item.icon || '📌'"></span>
                            </template>
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center space-x-2">
                                <h3 class="font-bold text-gray-800 dark:text-white truncate text-base" x-text="item.title"></h3>
                                <span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300 hidden sm:inline-block" x-text="item.category"></span>
                            </div>
                            <p class="text-xs text-gray-500 dark:text-gray-400 truncate max-w-xl" x-text="item.description"></p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 flex-shrink-0">
                        <a :href="item.url" target="_blank" class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700 transition shadow-sm">
                            Kunjungi ↗
                        </a>
                        <template x-if="isAdmin">
                            <button @click="deleteLink(item.id)" title="Hapus Kegiatan" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-xl transition">
                                🗑️
                            </button>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- JIKA TIDAK ADA DATA -->
        <div x-show="filteredLinks.length === 0" class="text-center py-16">
            <p class="text-gray-500 dark:text-gray-400 text-lg">Belum ada kegiatan/layanan di kategori ini.</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto bg-white dark:bg-gray-800 border-t border-gray-100 dark:border-gray-700 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500 dark:text-gray-400">
            <p x-text="config.footerText"></p>
        </div>
    </footer>

    <!-- MODAL POPUP: LOGIN ADMIN -->
    <div x-show="showLoginModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" style="display: none;">
        <div class="bg-white dark:bg-gray-900 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-gray-200 dark:border-gray-800 space-y-4">
            <div class="text-center">
                <h3 class="text-lg font-bold text-gray-800 dark:text-white">Login Admin</h3>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Masukkan PIN Admin (Default: Sentolo1)</p>
            </div>
            <form @submit.prevent="loginAdmin()" class="space-y-4">
                <input type="password" x-model="inputPin" placeholder="PIN Admin" required class="w-full p-3 text-center text-lg rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div class="flex space-x-2">
                    <button type="button" @click="showLoginModal = false" class="w-1/2 py-2.5 rounded-xl text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-800">Batal</button>
                    <button type="submit" class="w-1/2 py-2.5 rounded-xl text-white bg-emerald-600 hover:bg-emerald-700">Masuk</button>
                </div>
            </form>
        </div>
    </div>

    <!-- PANEL PENGATURAN TAMPILAN & FOTO HERO -->
    <div x-show="showCustomizer" class="fixed inset-0 z-50 overflow-hidden" style="display: none;">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" @click="showCustomizer = false"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white dark:bg-gray-900 shadow-2xl p-6 flex flex-col justify-between overflow-y-auto space-y-6">
                <div class="space-y-6">
                    <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-gray-800">
                        <h3 class="font-bold text-lg text-gray-800 dark:text-white">⚙️ Kustomisasi Web (Real-Time)</h3>
                        <button @click="showCustomizer = false" class="text-gray-400 hover:text-gray-600">✕</button>
                    </div>

                    <!-- PREVIEW & UPLOAD FOTO BANNER UTAMA -->
                    <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                        <label class="block text-sm font-semibold text-gray-800 dark:text-white">🖼️ Foto Banner Utama (Hero Image)</label>
                        
                        <div class="w-full h-32 rounded-xl overflow-hidden bg-gray-200 dark:bg-gray-700 border border-dashed border-gray-300 dark:border-gray-600 flex items-center justify-center relative">
                            <template x-if="heroImageUrl">
                                <img :src="heroImageUrl" class="w-full h-full object-cover">
                            </template>
                            <template x-if="!hero
