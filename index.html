<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Aplikasi Puskesmas</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Poppins', 'sans-serif'] },
            colors: {
              brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' }
            }
          }
        }
      }
    </script>

    <!-- FontAwesome & SweetAlert2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { transition: background 0.5s ease, color 0.5s ease; min-height: 100vh; background-attachment: fixed; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .card-app { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .card-app:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* PRESET 12 TEMA TAMPILAN */
        body.theme-rainbow { background: radial-gradient(at 40% 20%, #fde68a 0px, transparent 50%), radial-gradient(at 80% 0%, #7dd3fc 0px, transparent 50%), radial-gradient(at 0% 50%, #fbcfe8 0px, transparent 50%), radial-gradient(at 80% 50%, #f472b6 0px, transparent 50%), radial-gradient(at 0% 100%, #fdba74 0px, transparent 50%), radial-gradient(at 80% 100%, #a78bfa 0px, transparent 50%); background-color: #e0f2fe; color: #1e293b; }
        body.theme-ocean { background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #0f172a 100%); color: #f8fafc; }
        body.theme-emerald { background: linear-gradient(135deg, #059669 0%, #047857 50%, #064e3b 100%); color: #f8fafc; }
        body.theme-sunset { background: linear-gradient(135deg, #f97316 0%, #db2777 50%, #4c1d95 100%); color: #f8fafc; }
        body.theme-lavender { background: linear-gradient(135deg, #c084fc 0%, #a855f7 50%, #3b0764 100%); color: #f8fafc; }
        body.theme-mint { background: linear-gradient(135deg, #a7f3d0 0%, #6ee7b7 50%, #047857 100%); color: #064e3b; }
        body.theme-sunshine { background: linear-gradient(135deg, #fef08a 0%, #fde047 50%, #ca8a04 100%); color: #451a03; }
        body.theme-rose { background: linear-gradient(135deg, #f472b6 0%, #fb7185 50%, #881337 100%); color: #f8fafc; }
        body.theme-royal { background: linear-gradient(135deg, #1e40af 0%, #1e1b4b 100%); color: #f8fafc; }
        body.theme-slate { background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%); color: #0f172a; }
        body.theme-dark { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #f8fafc; }
        body.theme-cyberpunk { background: linear-gradient(135deg, #09090b 0%, #581c87 50%, #be185d 100%); color: #00f0ff; }

        body.theme-ocean .glass-panel, body.theme-dark .glass-panel, body.theme-royal .glass-panel, body.theme-cyberpunk .glass-panel, body.theme-emerald .glass-panel, body.theme-sunset .glass-panel, body.theme-lavender .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f8fafc;
        }
    </style>
</head>
<body class="theme-rainbow min-h-screen relative overflow-x-hidden">

    <!-- HEADER NAVBAR -->
    <header class="glass-panel sticky top-4 z-50 mx-4 md:mx-8 mt-4 rounded-3xl px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4 w-full md:w-auto">
            <!-- Logo Puskesmas -->
            <div class="relative group w-14 h-14 rounded-2xl bg-white p-1 shadow-md flex-shrink-0 cursor-pointer overflow-hidden" title="Klik untuk ganti logo Puskesmas" onclick="triggerLogoUpload()">
                <img id="main-logo" src="https://images.unsplash.com/photo-1584515933487-779824d29309?w=200" alt="Logo" class="w-full h-full object-cover rounded-xl">
                <div class="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center text-white text-xs font-bold rounded-xl">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <input type="file" id="logo-file-input" class="hidden" accept="image/*" onchange="uploadLogoDirectly(event)">
            </div>

            <div>
                <div class="flex items-center gap-2">
                    <h1 id="app-title-text" class="text-xl md:text-2xl font-extrabold tracking-tight">Portal Puskesmas</h1>
                    <button id="btn-edit-header" onclick="openHeaderModal()" class="hidden text-slate-500 hover:text-brand-500 text-xs p-1" title="Edit Teks Header">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <span id="sync-status" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Realtime Sync
                    </span>
                </div>
                <p id="app-subtitle-text" class="text-xs md:text-sm font-medium opacity-80">Wadah Aplikasi & Data Terpadu Seluruh Kluster</p>
            </div>
        </div>
        
        <div class="w-full md:w-auto flex flex-wrap items-center justify-end gap-3">
            <!-- SELECTOR TEMA -->
            <div class="flex items-center gap-2 glass-panel px-3 py-1.5 rounded-full">
                <i class="fa-solid fa-palette text-xs"></i>
                <select id="theme-selector" onchange="changeTheme(this.value)" class="bg-transparent text-xs font-bold focus:outline-none cursor-pointer">
                    <option value="theme-rainbow" class="text-slate-800">1. Pelangi Pastel (Default)</option>
                    <option value="theme-ocean" class="text-slate-800">2. Ocean Blue</option>
                    <option value="theme-emerald" class="text-slate-800">3. Kemenkes Emerald</option>
                    <option value="theme-sunset" class="text-slate-800">4. Sunset Glow</option>
                    <option value="theme-lavender" class="text-slate-800">5. Purple Lavender</option>
                    <option value="theme-mint" class="text-slate-800">6. Fresh Mint</option>
                    <option value="theme-sunshine" class="text-slate-800">7. Warm Sunshine</option>
                    <option value="theme-rose" class="text-slate-800">8. Rose Pink</option>
                    <option value="theme-royal" class="text-slate-800">9. Royal Navy</option>
                    <option value="theme-slate" class="text-slate-800">10. Minimal Slate</option>
                    <option value="theme-dark" class="text-slate-800">11. Dark Mode</option>
                    <option value="theme-cyberpunk" class="text-slate-800">12. Cyberpunk Neon</option>
                </select>
            </div>

            <!-- TOMBOL LOGIN ADMIN -->
            <button id="btn-admin-auth" onclick="toggleAdmin()" class="glass-panel hover:bg-white/90 px-5 py-2.5 rounded-full text-sm font-bold text-brand-600 transition-all shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-user-lock"></i> <span>Login Admin</span>
            </button>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-7xl mx-auto px-4 md:px-8 py-8 w-full">
        <!-- Tab Navigasi Kluster -->
        <div class="flex overflow-x-auto pb-4 pt-2 gap-3 hide-scroll mb-8" id="cluster-tabs"></div>

        <!-- Banner Hero Kluster -->
        <div class="glass-panel rounded-3xl p-6 md:p-8 mb-8 flex flex-col md:flex-row items-center gap-6 relative overflow-hidden" id="cluster-hero"></div>

        <!-- Grid Header -->
        <div class="flex justify-between items-end mb-6">
            <h2 class="text-2xl font-bold" id="grid-title">Daftar Aplikasi & File</h2>
            <button id="btn-add-app" onclick="openAppModal()" class="hidden bg-gradient-to-r from-brand-500 to-blue-600 hover:from-brand-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-blue-500/30 transition-all transform hover:scale-105 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-lg"></i> Tambah Baru
            </button>
        </div>

        <!-- GRID APLIKASI -->
        <div id="apps-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <!-- MODAL EDIT PORTAL HEADER & TEKS UMUM -->
    <div id="header-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeHeaderModal()"></div>
        <div class="glass-panel bg-white/95 text-slate-800 w-full max-w-lg rounded-3xl p-6 md:p-8 relative z-10 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800">Edit Judul & Teks Aplikasi</h3>
                <button onclick="closeHeaderModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 transition-colors">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            
            <form onsubmit="saveHeaderInfo(event)" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Judul Utama Portal</label>
                    <input type="text" id="input-app-name" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Sub-Judul / Slogan</label>
                    <input type="text" id="input-app-subtitle" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Judul Bagian Daftar Aplikasi</label>
                    <input type="text" id="input-grid-title" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                </div>
                <button type="submit" class="mt-2 w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg transition-colors">
                    Simpan Perubahan Teks
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT KLUSTER & BANNER HERO -->
    <div id="hero-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeHeroModal()"></div>
        <div class="glass-panel bg-white/95 text-slate-800 w-full max-w-lg rounded-3xl p-6 md:p-8 relative z-10 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800">Edit Info & Banner Kluster</h3>
                <button onclick="closeHeroModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 transition-colors">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            
            <form onsubmit="saveHeroInfo(event)" class="flex flex-col gap-4">
                <input type="hidden" id="hero-banner-base64">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Kluster</label>
                    <input type="text" id="input-hero-title" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Deskripsi Kluster</label>
                    <textarea id="input-hero-desc" rows="3" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Ganti Foto Banner Kluster</label>
                    <input type="file" id="hero-file-input" accept="image/*" onchange="convertHeroBannerToBase64(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-brand-50 file:text-brand-600 hover:file:bg-brand-100 border border-slate-200 rounded-xl cursor-pointer bg-white">
                </div>
                <div id="hero-preview-container" class="hidden w-full h-32 rounded-xl overflow-hidden border border-slate-200 relative">
                    <img id="hero-preview" src="" class="w-full h-full object-cover">
                    <span class="absolute bottom-2 left-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded">Pratinjau Banner</span>
                </div>
                <button type="submit" class="mt-2 w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg transition-colors">
                    Simpan Perubahan Kluster
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL FORM APLIKASI -->
    <div id="app-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeAppModal()"></div>
        <div class="glass-panel bg-white/95 text-slate-800 w-full max-w-lg rounded-3xl p-6 md:p-8 relative z-10 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="text-xl font-bold text-slate-800">Tambah Tautan / Aplikasi Baru</h3>
                <button onclick="closeAppModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 transition-colors">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            
            <form id="app-form" onsubmit="saveApp(event)" class="flex flex-col gap-4">
                <input type="hidden" id="app-id">
                <input type="hidden" id="app-image-base64">
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Aplikasi / File</label>
                    <input type="text" id="app-name" required placeholder="Cth: SIMPUS Antrean, Drive Foto" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">URL / Link Tujuan</label>
                    <input type="url" id="app-url" required placeholder="https://..." class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Pilih Gambar Sampul</label>
                    <input type="file" id="app-file-input" accept="image/*" onchange="convertImageToBase64(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-brand-50 file:text-brand-600 hover:file:bg-brand-100 border border-slate-200 rounded-xl cursor-pointer bg-white">
                </div>
                <div id="image-preview-container" class="hidden w-full h-32 rounded-xl overflow-hidden border border-slate-200 relative">
                    <img id="image-preview" src="" class="w-full h-full object-cover">
                    <span class="absolute bottom-2 left-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded">Pratinjau Foto</span>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Deskripsi Singkat</label>
                    <textarea id="app-desc" rows="2" placeholder="Sistem pelaporan..." class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm"></textarea>
                </div>
                <button type="submit" class="mt-2 w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg transition-colors">
                    Simpan Data
                </button>
            </form>
        </div>
    </div>

    <footer class="mt-12 mb-6 text-center text-xs font-medium opacity-60">
        &copy; 2026 Portal Aplikasi Puskesmas. Terintegrasi Cloud & Multi-Tema.
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCk6Rnh90zX1xy73fPq6tBJydU-4t8i_tw",
            authDomain: "portal-puskesmas.firebaseapp.com",
            databaseURL: "https://portal-puskesmas-default-rtdb.firebaseio.com",
            projectId: "portal-puskesmas",
            storageBucket: "portal-puskesmas.firebasestorage.app",
            messagingSenderId: "368016949700",
            appId: "1:368016949700:web:3a9e57ce16a99008c16491",
            measurementId: "G-F8BQ8QXH0Y"
        };

        let database = null;
        let isFirebaseConnected = false;

        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "PASTE_API_KEY_DI_SINI") {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                isFirebaseConnected = true;
            }
        } catch (e) {
            console.warn("Koneksi Firebase gagal, menggunakan penyimpanan lokal.", e);
        }

        const defaultData = {
            logoUrl: "https://images.unsplash.com/photo-1584515933487-779824d29309?w=200",
            appName: "Portal Puskesmas",
            appSubtitle: "Wadah Aplikasi & Data Terpadu Seluruh Kluster",
            gridTitle: "Daftar Aplikasi & File",
            activeTheme: "theme-rainbow",
            kluster1: { title: "Kluster 1: Manajemen", color: "from-blue-500 to-cyan-400", heroImg: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=800", desc: "Pusat berkas manajemen, perencanaan, lokmin bulanan, dan laporan keuangan BOK.", apps: [] },
            kluster2: { title: "Kluster 2: Ibu & Anak", color: "from-pink-500 to-rose-400", heroImg: "https://images.unsplash.com/photo-1519689680058-324335c77eba?w=800", desc: "Pusat aplikasi registrasi KIA, pemantauan stunting, dan jadwal imunisasi.", apps: [] },
            kluster3: { title: "Kluster 3: Dewasa & Lansia", color: "from-emerald-500 to-teal-400", heroImg: "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=800", desc: "Wadah pendataan usia produktif, posbindu, dan penyakit tidak menular.", apps: [] },
            kluster4: { title: "Kluster 4: P2P", color: "from-purple-500 to-indigo-400", heroImg: "https://images.unsplash.com/photo-1584362917165-526a968579e8?w=800", desc: "Pusat pelaporan penyakit menular, TBC, Hipertensi, dan Surveilans.", apps: [] },
            lintas: { title: "Lintas Kluster", color: "from-orange-500 to-amber-400", heroImg: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=800", desc: "Jadwal kegiatan promkes, Germas, UKS, dan penyuluhan lingkungan.", apps: [] },
            inovasi: { title: "Inovasi Puskesmas", color: "from-yellow-500 to-orange-400", heroImg: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800", desc: "Galeri pameran inovasi layanan publik dan antrean online.", apps: [] }
        };

        let db = defaultData;
        let currentKluster = 'kluster1';
        let isAdmin = false;
        const ADMIN_PASS = 'admin123';

        document.addEventListener('DOMContentLoaded', () => {
            loadThemeSetting();
            renderHeaderTexts();
            renderTabs();
            renderDashboard();

            if (isFirebaseConnected) {
                database.ref('puskesmas_db_v2').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) db = data;
                    if (db.logoUrl) document.getElementById('main-logo').src = db.logoUrl;
                    if (db.activeTheme) changeTheme(db.activeTheme, false);
                    renderHeaderTexts();
                    renderTabs();
                    renderDashboard();
                }, (error) => {
                    console.warn("Firebase Read Error", error);
                    loadFromLocalStorage();
                });
            } else {
                loadFromLocalStorage();
            }
        });

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('puskesmas_hub_db_v2');
            if (savedData) db = JSON.parse(savedData);
            if (db.logoUrl) document.getElementById('main-logo').src = db.logoUrl;
            if (db.activeTheme) changeTheme(db.activeTheme, false);
            renderHeaderTexts();
            renderTabs();
            renderDashboard();
        }

        function saveToCloud() {
            try {
                if (isFirebaseConnected) {
                    database.ref('puskesmas_db_v2').set(db);
                } else {
                    localStorage.setItem('puskesmas_hub_db_v2', JSON.stringify(db));
                }
            } catch (err) {
                console.error("Gagal menyimpan data:", err);
            }
        }

        function renderHeaderTexts() {
            document.getElementById('app-title-text').innerText = db.appName || "Portal Puskesmas";
            document.getElementById('app-subtitle-text').innerText = db.appSubtitle || "Wadah Aplikasi & Data Terpadu Seluruh Kluster";
            document.getElementById('grid-title').innerText = db.gridTitle || "Daftar Aplikasi & File";
            document.getElementById('btn-edit-header').style.display = isAdmin ? 'inline-block' : 'none';
        }

        function changeTheme(themeClass, isSave = true) {
            document.body.className = `${themeClass} min-h-screen relative overflow-x-hidden`;
            const selector = document.getElementById('theme-selector');
            if (selector) selector.value = themeClass;
            db.activeTheme = themeClass;
            if (isSave) saveToCloud();
        }

        function loadThemeSetting() {
            const currentTheme = db.activeTheme || 'theme-rainbow';
            changeTheme(currentTheme, false);
        }

        function triggerLogoUpload() {
            if (!isAdmin) {
                Swal.fire({ icon: 'info', title: 'Fitur Admin', text: 'Silakan Login Admin terlebih dahulu untuk mengganti logo.' });
                return;
            }
            document.getElementById('logo-file-input').click();
        }

        function uploadLogoDirectly(event) {
            const file = event.target.files[0];
            if (!file) return;

            compressImage(file, 200, 200, 0.8, (base64Image) => {
                document.getElementById('main-logo').src = base64Image;
                db.logoUrl = base64Image;
                saveToCloud();
                Swal.fire({ icon: 'success', title: 'Logo Diperbarui!', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
            });
        }

        // CONTROL HEADER TEXTS
        function openHeaderModal() {
            document.getElementById('input-app-name').value = db.appName || "Portal Puskesmas";
            document.getElementById('input-app-subtitle').value = db.appSubtitle || "Wadah Aplikasi & Data Terpadu Seluruh Kluster";
            document.getElementById('input-grid-title').value = db.gridTitle || "Daftar Aplikasi & File";
            document.getElementById('header-modal').classList.remove('hidden');
        }

        function closeHeaderModal() {
            document.getElementById('header-modal').classList.add('hidden');
        }

        function saveHeaderInfo(e) {
            e.preventDefault();
            db.appName = document.getElementById('input-app-name').value;
            db.appSubtitle = document.getElementById('input-app-subtitle').value;
            db.gridTitle = document.getElementById('input-grid-title').value;
            
            saveToCloud();
            renderHeaderTexts();
            closeHeaderModal();
            Swal.fire({ icon: 'success', title: 'Teks Header Diperbarui!', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
        }

        // CONTROL HERO BANNER & KLUSTER INFO
        function openHeroModal() {
            const data = db[currentKluster] || defaultData[currentKluster];
            document.getElementById('input-hero-title').value = data.title;
            document.getElementById('input-hero-desc').value = data.desc;
            document.getElementById('hero-banner-base64').value = '';
            document.getElementById('hero-preview-container').classList.add('hidden');
            document.getElementById('hero-modal').classList.remove('hidden');
        }

        function closeHeroModal() {
            document.getElementById('hero-modal').classList.add('hidden');
        }

        function convertHeroBannerToBase64(event) {
            const file = event.target.files[0];
            if (!file) return;

            compressImage(file, 1200, 600, 0.8, (base64String) => {
                document.getElementById('hero-banner-base64').value = base64String;
                document.getElementById('hero-preview').src = base64String;
                document.getElementById('hero-preview-container').classList.remove('hidden');
            });
        }

        function saveHeroInfo(e) {
            e.preventDefault();
            const newTitle = document.getElementById('input-hero-title').value;
            const newDesc = document.getElementById('input-hero-desc').value;
            const newImgBase64 = document.getElementById('hero-banner-base64').value;

            if (!db[currentKluster]) db[currentKluster] = defaultData[currentKluster];
            
            db[currentKluster].title = newTitle;
            db[currentKluster].desc = newDesc;
            if (newImgBase64) {
                db[currentKluster].heroImg = newImgBase64;
            }

            saveToCloud();
            renderTabs();
            renderDashboard();
            closeHeroModal();
            Swal.fire({ icon: 'success', title: 'Info Kluster Diperbarui!', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
        }

        function convertImageToBase64(event) {
            const file = event.target.files[0];
            if (!file) return;

            compressImage(file, 600, 400, 0.75, (base64String) => {
                document.getElementById('app-image-base64').value = base64String;
                document.getElementById('image-preview').src = base64String;
                document.getElementById('image-preview-container').classList.remove('hidden');
            });
        }

        function compressImage(file, maxWidth, maxHeight, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderTabs() {
            const container = document.getElementById('cluster-tabs');
            if (!container) return;
            container.innerHTML = '';
            
            const keys = ['kluster1', 'kluster2', 'kluster3', 'kluster4', 'lintas', 'inovasi'];
            keys.forEach(key => {
                if (!db[key]) return;
                const isActive = currentKluster === key;
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-6 py-2.5 rounded-full text-sm font-bold transition-all duration-300 ${
                    isActive 
                    ? `bg-gradient-to-r ${db[key].color} text-white shadow-lg transform scale-105`
                    : `glass-panel hover:bg-white/80`
                }`;
                btn.innerText = db[key].title.split(':')[0] || db[key].title;
                btn.onclick = () => {
                    currentKluster = key;
                    renderTabs();
                    renderDashboard();
                };
                container.appendChild(btn);
            });
        }

        function renderDashboard() {
            const data = db[currentKluster] || defaultData[currentKluster];
            
            const hero = document.getElementById('cluster-hero');
            if (hero) {
                let editHeroBtn = isAdmin 
                    ? `<button onclick="openHeroModal()" class="absolute top-4 right-4 z-20 bg-white/80 hover:bg-white text-slate-800 text-xs font-bold px-3 py-1.5 rounded-xl shadow border border-white/50 backdrop-blur-sm transition-all flex items-center gap-1.5">
                        <i class="fa-solid fa-pen"></i> Edit Banner & Teks Kluster
                      </button>`
                    : '';

                hero.innerHTML = `
                    ${editHeroBtn}
                    <div class="absolute inset-0 z-0">
                        <div class="absolute inset-0 bg-gradient-to-r ${data.color} opacity-85 mix-blend-multiply"></div>
                        <img src="${data.heroImg}" alt="Banner" class="w-full h-full object-cover">
                    </div>
                    <div class="relative z-10 w-full text-white">
                        <h2 class="text-3xl font-extrabold mb-2 drop-shadow-md">${data.title}</h2>
                        <p class="text-white/90 text-sm max-w-2xl font-medium drop-shadow">${data.desc}</p>
                    </div>
                `;
            }

            const btnAdd = document.getElementById('btn-add-app');
            if (btnAdd) btnAdd.style.display = isAdmin ? 'flex' : 'none';

            const grid = document.getElementById('apps-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const appsList = data.apps || [];

            if (appsList.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full glass-panel rounded-2xl p-10 text-center flex flex-col items-center justify-center">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 opacity-40"></i>
                        <h3 class="text-lg font-bold">Belum Ada Tautan di Kluster Ini</h3>
                        <p class="text-sm opacity-70 mt-1">Login Admin untuk mengunggah foto dan menambah tautan secara realtime.</p>
                    </div>
                `;
                return;
            }

            appsList.forEach(app => {
                const imageSrc = app.img ? app.img : `https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=500`;
                
                const card = document.createElement('div');
                card.className = "card-app glass-panel rounded-2xl overflow-hidden flex flex-col h-full relative group border border-white/40";
                
                let adminControls = '';
                if (isAdmin) {
                    adminControls = `
                        <div class="absolute top-3 right-3 z-20 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editApp('${app.id}')" class="w-8 h-8 rounded-full bg-white text-blue-600 shadow-md flex items-center justify-center hover:bg-blue-50" title="Edit"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteApp('${app.id}')" class="w-8 h-8 rounded-full bg-white text-rose-600 shadow-md flex items-center justify-center hover:bg-rose-50" title="Hapus"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${adminControls}
                    <div class="h-40 w-full overflow-hidden relative">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10"></div>
                        <img src="${imageSrc}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500" alt="${app.name}">
                        <h3 class="absolute bottom-3 left-4 right-4 z-20 text-white font-bold text-lg leading-tight truncate">${app.name}</h3>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <p class="text-xs font-medium mb-4 opacity-80 flex-grow line-clamp-2">${app.desc || ''}</p>
                        <a href="${app.url}" target="_blank" class="w-full text-center py-2.5 rounded-xl text-sm font-bold bg-white/80 text-slate-800 hover:bg-brand-500 hover:text-white transition-colors border border-white/50 shadow-sm">
                            Buka Tautan <i class="fa-solid fa-arrow-right ml-1 text-[10px]"></i>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // AUTH & CRUD
        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                updateAdminUI();
                renderHeaderTexts();
                renderDashboard();
                Swal.fire('Logout Berhasil', '', 'success');
            } else {
                Swal.fire({
                    title: 'Akses Admin',
                    text: 'Masukkan Kata Sandi Admin :',
                    input: 'password',
                    showCancelButton: true,
                    confirmButtonText: 'Masuk',
                    confirmButtonColor: '#0ea5e9'
                }).then((result) => {
                    if (result.isConfirmed && result.value === ADMIN_PASS) {
                        isAdmin = true;
                        updateAdminUI();
                        renderHeaderTexts();
                        renderDashboard();
                        Swal.fire({ icon: 'success', title: 'Mode Admin Aktif', showConfirmButton: false, timer: 1500 });
                    } else if (result.isConfirmed) {
                        Swal.fire({ icon: 'error', title: 'Kata Sandi Salah' });
                    }
                });
            }
        }

        function updateAdminUI() {
            const btn = document.getElementById('btn-admin-auth');
            if (!btn) return;
            if (isAdmin) {
                btn.innerHTML = `<i class="fa-solid fa-unlock"></i> <span>Mode Admin</span>`;
                btn.classList.replace('text-brand-600', 'text-rose-600');
            } else {
                btn.innerHTML = `<i class="fa-solid fa-user-lock"></i> <span>Login Admin</span>`;
                btn.classList.replace('text-rose-600', 'text-brand-600');
            }
        }

        function openAppModal() {
            document.getElementById('modal-title').innerText = "Tambah Tautan Baru";
            document.getElementById('app-id').value = '';
            document.getElementById('app-image-base64').value = '';
            document.getElementById('app-form').reset();
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('app-modal').classList.remove('hidden');
        }

        function closeAppModal() {
            document.getElementById('app-modal').classList.add('hidden');
        }

        function saveApp(e) {
            e.preventDefault();
            const id = document.getElementById('app-id').value;
            const name = document.getElementById('app-name').value;
            const url = document.getElementById('app-url').value;
            const imgBase64 = document.getElementById('app-image-base64').value;
            const desc = document.getElementById('app-desc').value;

            if (!db[currentKluster].apps) db[currentKluster].apps = [];

            if (id) {
                const index = db[currentKluster].apps.findIndex(a => a.id === id);
                if (index > -1) {
                    const oldImg = db[currentKluster].apps[index].img;
                    db[currentKluster].apps[index] = { 
                        id, 
                        name, 
                        url, 
                        img: imgBase64 || oldImg, 
                        desc 
                    };
                }
            } else {
                const newId = Date.now().toString();
                db[currentKluster].apps.push({ 
                    id: newId, 
                    name, 
                    url, 
                    img: imgBase64 || '', 
                    desc 
                });
            }

            saveToCloud();
            closeAppModal();
            renderDashboard();
            Swal.fire({ icon: 'success', title: 'Data & Foto Disimpan!', showConfirmButton: false, timer: 1500, toast: true, position: 'top-end' });
        }

        function editApp(id) {
            const app = db[currentKluster].apps.find(a => a.id === id);
            if (!app) return;
            
            document.getElementById('modal-title').innerText = "Ubah Tautan";
            document.getElementById('app-id').value = app.id;
            document.getElementById('app-name').value = app.name;
            document.getElementById('app-url').value = app.url;
            document.getElementById('app-image-base64').value = app.img || '';
            document.getElementById('app-desc').value = app.desc || '';
            
            if (app.img) {
                document.getElementById('image-preview').src = app.img;
                document.getElementById('image-preview-container').classList.remove('hidden');
            } else {
                document.getElementById('image-preview-container').classList.add('hidden');
            }

            document.getElementById('app-modal').classList.remove('hidden');
        }

        function deleteApp(id) {
            Swal.fire({
                title: 'Hapus Tautan Ini?',
                text: "Foto dan data akan terhapus di seluruh perangkat!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                confirmButtonText: 'Ya, Hapus!'
            }).then((result) => {
                if (result.isConfirmed) {
                    db[currentKluster].apps = db[currentKluster].apps.filter(a => a.id !== id);
                    saveToCloud();
                    renderDashboard();
                    Swal.fire({ icon: 'success', title: 'Terhapus!', showConfirmButton: false, timer: 1500, toast: true, position: 'top-end' });
                }
            });
        }
    </script>
</body>
